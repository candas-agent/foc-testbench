; FOC test bench - B-G431B-ESC1 + hoverboard motor with hall sensors
;
; The SimpleFOC libraries are pulled from the forks/branches under test, so the
; code that is compiled is always the code being tested.

[platformio]
default_envs = esc1_hall

[env]
platform = ststm32
board = disco_b_g431b_esc1
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_eol = LF
lib_archive = false
build_flags =
  -D HAL_OPAMP_MODULE_ENABLED
  ; debug symbols in the ELF, needed by MCUViewer to find the variables (no impact on the code)
  -g
  ; do NOT add PIO_FRAMEWORK_ARDUINO_ENABLE_CDC on this board:
  ; it uses one of the PWM pins as USB data line
lib_deps =
  https://github.com/candas-agent/Arduino-FOC.git#feat/deadtime-compensation
  https://github.com/candas-agent/Arduino-FOC-drivers.git#fix/mxlemming-checks

; hall sensors only (angle in 60 deg electrical steps)
[env:esc1_hall]

; hall sensors + SmoothingSensor (angle extrapolated between hall edges)
[env:esc1_hall_smoothing]
build_flags =
  ${env.build_flags}
  -D USE_SMOOTHING_SENSOR
