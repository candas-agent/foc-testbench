; FOC test bench - hoverboard motor, no position sensor used (open loop)
;   esc1     : B-G431B-ESC1, commands over the ST-Link virtual COM port
;   gd32f130 : hoverboard split board TT-SD2.2 (GD32F130C8), commands over RTT through an ST-Link
;
; The SimpleFOC libraries are pulled from the forks/branches under test, so the
; code that is compiled is always the code being tested.

[platformio]
default_envs = esc1

[env]
framework = arduino
upload_protocol = stlink
debug_tool = stlink
; no lib_archive here: each library decides in its library.json. SimpleFOC and testbench are not archived
; (they replace weak functions), the others are, so that their unused global objects are not linked.
; src/equiv: on-target equivalence test firmwares, only in the equiv_* envs; src/gd32check: gd32chk_* envs; src/phasecheck: gd32_phase_* envs
build_src_filter = +<*> -<equiv/> -<gd32check/> -<phasecheck/> -<phasebrake/> -<example_split/>
build_flags =
  ; lib/testbench includes config.h from the project include folder
  -I include
  ; debug symbols in the ELF (no impact on the code)
  -g

[env:esc1]
; pinned: ststm32 15.x needs a framework removed from the registry, 20.x ships STM32 core 3.0
; which breaks SimpleFOC (enableTimerClock signature). 19.7.x = core 2.12
platform = platformio/ststm32@~19.7.1
board = disco_b_g431b_esc1
monitor_speed = 115200
monitor_eol = LF
test_framework = unity
test_speed = 115200
build_flags =
  ${env.build_flags}
  -D HAL_OPAMP_MODULE_ENABLED
  ; do NOT add PIO_FRAMEWORK_ARDUINO_ENABLE_CDC on this board:
  ; it uses one of the PWM pins as USB data line
lib_deps =
  https://github.com/candas-agent/Arduino-FOC.git#feat/deadtime-compensation
  ; MXLEMMING observer, run in parallel to the open loop
  https://github.com/candas-agent/Arduino-FOC-drivers.git#fix/mxlemming-checks

[env:gd32f130]
platform = https://github.com/CommunityGD32Cores/platform-gd32.git
platform_packages = framework-arduinogd32@https://github.com/CommunityGD32Cores/ArduinoCore-GD32.git
board = genericGD32F130C8
; control loop code in the first 32 KB of flash (zero wait state area), see the linker script
board_build.ldscript = ld/gd32f130_fastloop.ld
; FreeRTOS: pulled in by the library finder (SimpleFOC includes it for ESP32), not used, hooked on SysTick
lib_ignore = FreeRTOS for GD32
build_flags =
  ${env.build_flags}
  -D BOARD_GD32F130_SPLIT
  ; the low side MOSFET drivers of these boards are active low
  -D SIMPLEFOC_PWM_LOWSIDE_ACTIVE_HIGH=false
  ; 8 KB of RAM (2 KB reserved for the stack): RTT output buffer 512 bytes instead of 1 KB
  -D BUFFER_SIZE_UP=512
  ; loop profiler (XP, XB commands, prof variable read with pyOCD)
  -D BENCH_PROFILE
  ; faster _sin/_cos/_sincos/_normalizeAngle (lib/testbench/src/fastmath.cpp)
  -D BENCH_FAST_MATH
  ; monotonic micros() (lib/testbench/src/gd32_micros.c): the core one goes back by up to 1 ms at the SysTick wrap
  -Wl,--wrap=getCurrentMicros
  -Wl,-Map,${BUILD_DIR}/firmware.map
lib_deps =
  ; GD32 driver (Candas1 dev-gd32, synced with SimpleFOC master) + dead-time compensation
  https://github.com/candas-agent/Arduino-FOC.git#test/gd32-deadtime
  https://github.com/candas-agent/Arduino-FOC-drivers.git#fix/mxlemming-checks
  koendv/RTT Stream@^1.3.0
; pio test reads the results over serial, not available on this board (no virtual COM port)
test_ignore = *

[env:gd32f130_qfp]
; same firmware with the soft float add/sub/mul/div/sqrt of Qfplib-M3 (Mark Owen, GPL v2) instead of libgcc.
; lib/qfplib is NOT in the repository (licence): download qfplib-m3 from http://www.quinapalus.com/qfplib-m3.html
; and copy qfplib-m3.s and qfplib-m3.h to lib/qfplib/src (see docs/test-log.md).
extends = env:gd32f130
build_flags =
  ${env:gd32f130.build_flags}
  -D BENCH_QFPLIB
  -Wl,--wrap=__aeabi_fadd,--wrap=__aeabi_fsub,--wrap=__aeabi_frsub,--wrap=__aeabi_fmul,--wrap=__aeabi_fdiv,--wrap=sqrtf
lib_deps =
  ${env:gd32f130.lib_deps}
  qfplib

[env:gd32f130_perf]
; loop optimisation tests: SimpleFOC from the local clone (branch perf/gd32-loop, not pushed)
extends = env:gd32f130
build_flags =
  ${env:gd32f130.build_flags}
  -D BENCH_SINCOS_CACHE
  -D MOTION_DOWNSAMPLE=3
; control loop files at -O2 (scripts/o2_hot.py)
extra_scripts = pre:scripts/o2_hot.py
lib_deps =
  ; perf/gd32-loop
  https://github.com/candas-agent/Arduino-FOC.git#925c1220aab8dfdf1581c5e4f3477acc6439d509
  https://github.com/candas-agent/Arduino-FOC-drivers.git#fix/mxlemming-checks
  koendv/RTT Stream@^1.3.0

[env:gd32f130_perf_qfp]
; gd32f130_perf + Qfplib-M3 (lib/qfplib, not in the repository, see env gd32f130_qfp)
extends = env:gd32f130_perf
; without the -O2 script: Qfplib + -O2 code does not fit in the 32 KB zero wait state area
extra_scripts =
build_flags =
  ${env:gd32f130_perf.build_flags}
  -D BENCH_QFPLIB
  -Wl,--wrap=__aeabi_fadd,--wrap=__aeabi_fsub,--wrap=__aeabi_frsub,--wrap=__aeabi_fmul,--wrap=__aeabi_fdiv,--wrap=sqrtf
lib_deps =
  ${env:gd32f130_perf.lib_deps}
  qfplib

[env:esc1_size]
; size test on the ESC1 (STM32G431): small atof/atoi instead of the newlib ones (not tested on hardware yet)
extends = env:esc1
build_flags =
  ${env:esc1.build_flags}
  -D BENCH_SMALL_ATOF
  -Wl,-Map,${BUILD_DIR}/firmware.map

; --- SmoothingSensor PR measurement: identical except the drivers (simplefoc dev vs dev + fix) ---
; SimpleFOC: GD32 driver + deadtime compensation + simplefoc dev merged (885ed63), without the loop optimisations
[smooth_common]
extends = env:gd32f130
build_flags =
  ${env:gd32f130.build_flags}
  ; XB micro benchmarks (sensor update cycles)
  -D BENCH_MICROBENCH

[env:smooth_dev]
extends = smooth_common
lib_deps =
  ; perf/gd32-loop base: dev-gd32 + dead-time compensation + simplefoc dev
  https://github.com/candas-agent/Arduino-FOC.git#885ed63dfb0f160b75c60d3f6b2789dfb85bc9f5
  ; drivers dev
  https://github.com/simplefoc/Arduino-FOC-drivers.git#1f67e02e685118fff8442669157e21a4aee13b5c
  koendv/RTT Stream@^1.3.0

[env:smooth_fix]
extends = smooth_common
lib_deps =
  ; perf/gd32-loop base: dev-gd32 + dead-time compensation + simplefoc dev
  https://github.com/candas-agent/Arduino-FOC.git#885ed63dfb0f160b75c60d3f6b2789dfb85bc9f5
  ; fix/smoothing-sensor-float
  https://github.com/candas-agent/Arduino-FOC-drivers.git#b8efb48e8cc7ccdd7ccba76084739415c62455ee
  koendv/RTT Stream@^1.3.0

; --- Same SmoothingSensor measurement on the STM32F103 hoverboard board, with plain SimpleFOC dev ---
; (pins from Candas1/Split_Hoverboard_SimpleFOC). SimpleFOC upstream dev (ae7b3ad), no dead-time API:
; BENCH_NO_DEADTIME. Only the drivers differ: upstream dev (1f67e02) vs fix/smoothing-sensor-float.
; NOT TESTED ON HARDWARE YET.
[smooth_f103_common]
platform = platformio/ststm32@~19.7.1
board = genericSTM32F103RC
test_ignore = *
build_flags =
  ${env.build_flags}
  -D BOARD_STM32F103_SPLIT
  -D BENCH_NO_DEADTIME
  -D SIMPLEFOC_PWM_LOWSIDE_ACTIVE_HIGH=false
  ; no SIMPLEFOC_STM32_ADC_INTERRUPT: on F1 (SimpleFOC dev ae7b3ad) the HAL disables the JEOC interrupt after the
  ; first conversion (regular group software start, not continuous), the currents stay frozen. TIM1 has a
  ; repetition counter: the injected registers are read directly, no interrupt needed.
  -D BENCH_PROFILE
  -D BENCH_MICROBENCH
  -Wl,-Map,${BUILD_DIR}/firmware.map

[env:smooth_f103_dev]
extends = smooth_f103_common
lib_deps =
  ; simplefoc dev
  https://github.com/simplefoc/Arduino-FOC.git#ae7b3add93b7ddb863cbb21ed31aae44330ae216
  ; drivers dev
  https://github.com/simplefoc/Arduino-FOC-drivers.git#1f67e02e685118fff8442669157e21a4aee13b5c
  koendv/RTT Stream@^1.3.0

[env:smooth_f103_fix]
extends = smooth_f103_common
lib_deps =
  ; simplefoc dev
  https://github.com/simplefoc/Arduino-FOC.git#ae7b3add93b7ddb863cbb21ed31aae44330ae216
  ; fix/smoothing-sensor-float
  https://github.com/candas-agent/Arduino-FOC-drivers.git#b8efb48e8cc7ccdd7ccba76084739415c62455ee
  koendv/RTT Stream@^1.3.0

; Same as smooth_f103_dev WITH -D SIMPLEFOC_STM32_ADC_INTERRUPT, to check on a genuine STM32F103 whether the
