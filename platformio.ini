; ---------------------------------------------------------------------------------------------------------------
; On-target equivalence tests (src/equiv/equiv_main.cpp, read with tools/equiv_read.py): PR code vs a copy of dev.
; The *_dev envs link dev itself: every case must then be identical (checks the copies).
; equiv_pid_*: no peripheral, safe with the board supplied. equiv_pwm_*: PWM on the motor pins and PC6-PC8,
; MAIN SUPPLY OFF (board on the ST-Link 3.3 V), the firmware refuses to start if the bus voltage reads > 10 V.
[equiv_f103_common]
extends = smooth_f103_common
build_src_filter = -<*> +<equiv/>

[env:equiv_pid_dev_f103]
extends = equiv_f103_common
build_flags = ${smooth_f103_common.build_flags} -D EQUIV_PID
