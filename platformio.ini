; FOC test bench - B-G431B-ESC1 + hoverboard motor (no position sensor, open loop)
;
; The SimpleFOC libraries are pulled from the forks/branches under test, so the
; code that is compiled is always the code being tested.

[platformio]
default_envs = esc1

[env]
; pinned: ststm32 15.x needs a framework removed from the registry, 20.x ships STM32 core 3.0
; which breaks SimpleFOC (enableTimerClock signature). 19.7.x = core 2.12
platform = platformio/ststm32@~19.7.1
board = disco_b_g431b_esc1
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_eol = LF
test_framework = unity
test_speed = 115200
lib_archive = false
build_flags =
  -D HAL_OPAMP_MODULE_ENABLED
  ; lib/testbench includes config.h from the project include folder
  -I include
  ; debug symbols in the ELF, needed by MCUViewer to find the variables (no impact on the code)
  -g
  ; do NOT add PIO_FRAMEWORK_ARDUINO_ENABLE_CDC on this board:
  ; it uses one of the PWM pins as USB data line
lib_deps =
  https://github.com/candas-agent/Arduino-FOC.git#feat/deadtime-compensation
  ; MXLEMMING observer, for the sensorless tests later
  https://github.com/candas-agent/Arduino-FOC-drivers.git#fix/mxlemming-checks

[env:esc1]
